<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#0c1118">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORGE">

  <title>FORGE | 12-Week AFT Rebuild</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <button class="icon-button" id="menuBtn" aria-label="Open menu">☰</button>

  <div class="brand">
    <span class="brand-main">FORGE</span>
    <span class="brand-sub">AFT REBUILD</span>
  </div>

  <button class="icon-button" id="timerBtn" aria-label="Rest timer">⏱</button>
</header>

<div id="drawerOverlay" class="drawer-overlay"></div>

<nav id="drawer" class="drawer">
  <div class="drawer-title">
    <span>FORGE</span>
    <button id="closeMenu" class="icon-button">×</button>
  </div>

  <button data-view="home">⌂ Dashboard</button>
  <button data-view="weeks">▦ 12-Week Plan</button>
  <button data-view="progress">↗ Progress</button>
  <button data-view="aft">★ AFT Tracker</button>
  <button data-view="backup">⇩ Backup & Data</button>

  <div class="drawer-footer">
    TRX • 15-lb KB • Cardio • Mobility
  </div>
</nav>

<main id="app"></main>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop" data-close-modal></div>

  <div class="modal-card">
    <button class="modal-close" data-close-modal>×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="timerPanel" class="timer-panel hidden">
  <div class="timer-card">
    <button id="closeTimer" class="modal-close">×</button>

    <div class="eyebrow">REST TIMER</div>

    <div id="timerDisplay" class="timer-display">01:00</div>

    <div class="timer-presets">
      <button data-seconds="30">:30</button>
      <button data-seconds="60">1:00</button>
      <button data-seconds="90">1:30</button>
      <button data-seconds="120">2:00</button>
    </div>

    <div class="timer-actions">
      <button id="timerStart" class="primary">Start</button>
      <button id="timerReset" class="secondary">Reset</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
